name: Auto update daily from upstream

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Usamos el PAT para tener permisos de modificar workflows
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ryanbr/noop.git
          git remote -v

      - name: Fetch upstream
        run: |
          git fetch --no-tags upstream main

      - name: Check and merge upstream changes
        run: |
          set -e

          COUNT=$(git rev-list HEAD..upstream/main --count)
          echo "New upstream commits: $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "Already up to date. Nothing to do."
            exit 0
          fi

          echo "Merging upstream/main..."
          git merge upstream/main -X theirs --no-edit

          echo "Pushing updated main..."
          git push origin HEAD:main
