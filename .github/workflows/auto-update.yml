jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      new_commits: ${{ steps.sync.outputs.new_commits }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
    - name: Add upstream remote
      run: |
        # Remove upstream if it already exists to avoid "remote already exists" error
        git remote remove upstream 2>/dev/null || true
        git remote add upstream https://github.com/ryanbr/noop.git
        echo "Upstream remote configured"
    
    - name: Fetch upstream
      run: |
        echo "Fetching from upstream..."
        git fetch upstream main
        echo "Fetch successful"
    
    - name: Count new commits
      id: sync
      run: |
        COUNT=$(git rev-list HEAD..upstream/main --count)
        echo "new_commits=$COUNT" >> "$GITHUB_OUTPUT"
        echo "New commits found: $COUNT"
    
    - name: Merge upstream changes
      if: steps.sync.outputs.new_commits != '0'
      run: |
        echo "Merging upstream/main into main..."
        # Use rebase instead of merge to keep history cleaner
        # If there are conflicts, this will fail and we'll handle it
        if git merge upstream/main --no-edit -m "Merge upstream changes (auto-sync)"; then
          echo "Merge successful"
        else
          echo "::error::Merge failed due to conflicts"
          echo "Attempting merge with -X theirs strategy..."
          git merge --abort
          git merge upstream/main -X theirs --no-edit -m "Merge upstream changes (auto-sync, theirs strategy)"
          echo "Merge successful with theirs strategy"
        fi
    
    - name: Push to main
      if: steps.sync.outputs.new_commits != '0'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Pushing changes to origin..."
        git push origin main
        echo "Push successful"name: Auto update and build iOS 16.3

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      new_commits: ${{ steps.sync.outputs.new_commits }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Sync upstream
      id: sync
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add upstream https://github.com/ryanbr/noop.git
        git fetch upstream main
        COUNT=$(git rev-list HEAD..upstream/main --count)
        echo "new_commits=$COUNT" >> "$GITHUB_OUTPUT"
        echo "New commits found: $COUNT"
        if [ "$COUNT" -gt 0 ]; then
          git merge upstream/main -X theirs --no-edit
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: sync
    if: needs.sync.outputs.new_commits != '0' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Apply iOS 16.3 patches
      run: |
        sed -i '' 's/deploymentTarget: "17.0"/deploymentTarget: "16.3"/g' project.yml
        python3 << 'PYEOF'
        import re, os

        def fix_timer(path):
            if not os.path.exists(path):
                return
            lines = open(path).readlines()
            out, i = [], 0
            while i < len(lines):
                if '.sensoryFeedback(trigger:' in lines[i]:
                    depth = 0
                    while i < len(lines):
                        depth += lines[i].count('{') - lines[i].count('}')
                        i += 1
                        if depth == 0:
                            break
                    continue
                out.append(lines[i])
                i += 1
            open(path, 'w').writelines(out)
            print('patched', path)

        def fix_scaffold(path):
            if not os.path.exists(path):
                return
            lines = open(path).readlines()
            targets = [i for i, l in enumerate(lines) if '.scrollBounceBehavior(' in l and not l.strip().startswith('//')]
            for idx in reversed(targets):
                start = idx
                while start > 0 and '#if os(iOS)' not in lines[start]:
                    start -= 1
                end = idx
                while end < len(lines) and '#endif' not in lines[end]:
                    end += 1
                del lines[start:end + 1]
            open(path, 'w').writelines(lines)
            print('patched', path)

        def fix_onchange(path):
            c = open(path).read()
            c2 = re.sub(r'\.onChange\(of: ([^)]*)\) \{ _, ([A-Za-z_][A-Za-z0-9_]*) in', r'.onChange(of: \1) { \2 in', c)
            c2 = re.sub(r'\.onChange\(of: ([^)]*)\) \{ _, _ in', r'.onChange(of: \1) { _ in', c2)
            if c2 != c:
                open(path, 'w').write(c2)
                print('patched', path)

        fix_timer('Strand/Screens/IntervalTimerView.swift')
        fix_scaffold('Strand/Screens/ScreenScaffold.swift')
        for d in ['Strand', 'StrandiOS', 'StrandiOSShared']:
            for root, _, files in os.walk(d):
                for f in files:
                    if f.endswith('.swift'):
                        fix_onchange(os.path.join(root, f))
        print('All patches applied')
        PYEOF

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build archive
      run: |
        xcodebuild archive \
          -project Strand.xcodeproj \
          -scheme NOOPiOS \
          -destination 'generic/platform=iOS' \
          -archivePath ./NOOPiOS.xcarchive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R ./NOOPiOS.xcarchive/Products/Applications/NOOP\ Staging.app ./Payload/
        zip -r NOOP_iOS16_TrollStore.ipa Payload

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NOOP-iOS16-TrollStore
        path: NOOP_iOS16_TrollStore.ipa
        retention-days: 90

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-ios16
        name: "NOOP iOS 16.3 (auto-actualizada)"
        files: NOOP_iOS16_TrollStore.ipa
