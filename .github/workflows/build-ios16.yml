name: Build iOS 16.3 IPA for TrollStore

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional)'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        brew install xcodegen
    
    - name: Apply iOS 16.3 compatibility patches
      run: |
        echo "🔧 Applying iOS 16.3 patches..."
        
        # 1. Change deployment target
        sed -i '' 's/deploymentTarget: "17.0"/deploymentTarget: "16.3"/g' project.yml
        
        # 2. Remove watchOS dependency
        sed -i '' '/^  - target: NOOPWatch$/s/^/#/' project.yml
        
        # 3. Fix sensoryFeedback in IntervalTimerView.swift
        python3 << 'PYTHON'
        with open('Strand/Screens/IntervalTimerView.swift', 'r') as f:
            lines = f.readlines()
        new_lines = []
        for i, line in enumerate(lines, 1):
            if 133 <= i <= 140:
                continue
            new_lines.append(line)
        with open('Strand/Screens/IntervalTimerView.swift', 'w') as f:
            f.writelines(new_lines)
        print("✓ IntervalTimerView.swift patched")
        PYTHON
        
        # 4. Fix ScreenScaffold.swift
        python3 << 'PYTHON'
        import re
        with open('Strand/Screens/ScreenScaffold.swift', 'r') as f:
            lines = f.readlines()
        new_lines = []
        skip_next_endif = False
        for i, line in enumerate(lines):
            if '#if os(iOS)' in line and i < 70:
                if i+1 < len(lines) and '// #697:' in lines[i+1]:
                    skip_next_endif = True
                    continue
            if skip_next_endif:
                if line.strip() == '#endif':
                    skip_next_endif = False
                continue
            new_lines.append(line)
        content = ''.join(new_lines)
        content = re.sub(r'\.onChange\(of: ([^)]+)\) \{ _, ([a-zA-Z_][a-zA-Z0-9_]*) in', r'.onChange(of: \1) { \2 in', content)
        content = re.sub(r'\.onChange\(of: ([^)]+)\) \{ _, _ in', r'.onChange(of: \1) { _ in', content)
        with open('Strand/Screens/ScreenScaffold.swift', 'w') as f:
            f.write(content)
        print("✓ ScreenScaffold.swift patched")
        PYTHON
        
        # 5. Fix all onChange with two parameters
        find Strand StrandiOS StrandiOSShared -name "*.swift" -type f -exec sed -i '' 's/\.onChange(of: \([^)]*\)) { _, \([^ ]*\) in/.onChange(of: \1) { \2 in/g' {} +
        find Strand StrandiOS StrandiOSShared -name "*.swift" -type f -exec sed -i '' 's/\.onChange(of: \([^)]*\)) { _, _ in/.onChange(of: \1) { _ in/g' {} +
        
        echo "✅ All patches applied"
    
    - name: Generate Xcode project
      run: |
        xcodegen generate
    
    - name: Build for iOS 16.3
      run: |
        xcodebuild archive \
          -project Strand.xcodeproj \
          -scheme NOOPiOS \
          -destination 'generic/platform=iOS' \
          -archivePath ./NOOPiOS.xcarchive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R ./NOOPiOS.xcarchive/Products/Applications/NOOP\ Staging.app ./Payload/
        zip -r NOOP_iOS16_TrollStore.ipa Payload
        echo "📦 IPA created successfully"
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: NOOP-iOS16-TrollStore
        path: NOOP_iOS16_TrollStore.ipa
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: NOOP_iOS16_TrollStore.ipa
        name: "NOOP iOS 16.3 - ${{ github.ref_name }}"
        body: |
          ## NOOP for iOS 16.3.1 (TrollStore)
          
          ### Installation
          1. Download the IPA file below
          2. Transfer to your iPhone
          3. Open with TrollStore
          
          ### Changes
          - Downgraded to iOS 16.3 deployment target
          - Removed iOS 17+ only APIs
          - Compatible with TrollStore
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
