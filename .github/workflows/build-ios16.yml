name: Build iOS 16.3 IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Apply iOS 16.3 patches
      run: |
        sed -i '' 's/deploymentTarget: "17.0"/deploymentTarget: "16.3"/g' project.yml
        python3 << 'PYEOF'
        import re, os

        def fix_timer(path):
            if not os.path.exists(path):
                return
            lines = open(path).readlines()
            out, i = [], 0
            while i < len(lines):
                if '.sensoryFeedback(trigger:' in lines[i]:
                    depth = 0
                    while i < len(lines):
                        depth += lines[i].count('{') - lines[i].count('}')
                        i += 1
                        if depth == 0:
                            break
                    continue
                out.append(lines[i])
                i += 1
            open(path, 'w').writelines(out)
            print('patched sensoryFeedback in', path)

        def fix_onchange(path):
            if not os.path.exists(path):
                return
            c = open(path).read()
            c2 = re.sub(r'\.onChange\(of: ([^)]*)\) \{ _, ([A-Za-z_][A-Za-z0-9_]*) in', r'.onChange(of: \1) { \2 in', c)
            c2 = re.sub(r'\.onChange\(of: ([^)]*)\) \{ _, _ in', r'.onChange(of: \1) { _ in', c2)
            if c2 != c:
                open(path, 'w').write(c2)
                print('patched onChange in', path)

        def fix_scroll_bounce_blocks(path):
            """Remove entire #if os(iOS) blocks containing scrollBounceBehavior"""
            if not os.path.exists(path):
                return
            lines = open(path).readlines()
            out = []
            i = 0
            while i < len(lines):
                # Check if this is an #if os(iOS) block
                if lines[i].strip() == '#if os(iOS)':
                    # Look ahead to see if this block contains scrollBounceBehavior
                    block_start = i
                    j = i + 1
                    found_scroll_bounce = False
                    while j < len(lines):
                        if lines[j].strip() == '#endif':
                            # Check if we found scrollBounceBehavior in this block
                            block_content = ''.join(lines[block_start:j+1])
                            if '.scrollBounceBehavior(' in block_content:
                                found_scroll_bounce = True
                            break
                        j += 1
                    
                    if found_scroll_bounce:
                        # Skip the entire block (don't add to output)
                        i = j + 1
                        print(f'removed scrollBounceBehavior block in {path}')
                        continue
                
                out.append(lines[i])
                i += 1
            
            if len(out) != len(lines):
                open(path, 'w').writelines(out)

        # Apply all patches to all Swift files
        for d in ['Strand', 'StrandiOS', 'StrandiOSShared', 'StrandiOSWidgets']:
            if not os.path.exists(d):
                continue
            for root, _, files in os.walk(d):
                for f in files:
                    if f.endswith('.swift'):
                        path = os.path.join(root, f)
                        fix_timer(path)
                        fix_onchange(path)
                        fix_scroll_bounce_blocks(path)

        print('All patches applied')
        PYEOF

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build archive
      run: |
        xcodebuild archive \
          -project Strand.xcodeproj \
          -scheme NOOPiOS \
          -destination 'generic/platform=iOS' \
          -archivePath ./NOOPiOS.xcarchive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R ./NOOPiOS.xcarchive/Products/Applications/NOOP\ Staging.app ./Payload/
        zip -r NOOP_iOS16_TrollStore.ipa Payload

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NOOP-iOS16-TrollStore
        path: NOOP_iOS16_TrollStore.ipa
        retention-days: 90

    - name: Update latest-ios16 release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-ios16
        name: "NOOP iOS 16.3 (auto-actualizada)"
        files: NOOP_iOS16_TrollStore.ipa
        prerelease: false
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
