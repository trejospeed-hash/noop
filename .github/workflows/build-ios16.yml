name: Build iOS 16.3 IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare release notes
      id: release_meta
      shell: bash
      run: |
        set -euo pipefail

        VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
        SHORT_SHA="$(git rev-parse --short HEAD)"
        DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-ios16/NOOP_iOS16_TrollStore.ipa"
        PREVIOUS_SHA="$(git rev-list -n 1 latest-ios16 2>/dev/null || true)"

        if [ -n "$PREVIOUS_SHA" ] && git merge-base --is-ancestor "$PREVIOUS_SHA" HEAD; then
          CHANGELOG="$(git log --oneline --no-merges "${PREVIOUS_SHA}..HEAD" | head -20 || true)"
        else
          CHANGELOG="$(git log --oneline --no-merges -20 || true)"
        fi

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="No new non-merge commits detected."
        fi

        {
          echo "version=${VERSION}"
          echo "short_sha=${SHORT_SHA}"
          echo "download_url=${DOWNLOAD_URL}"
          echo "subject=NOOP iOS 16.3.1 actualizado - ${VERSION}/${SHORT_SHA}"
          echo "body<<MAIL_BODY_EOF"
          echo "NOOP iOS 16.3.1 actualizado"
          echo
          echo "Version: ${VERSION}"
          echo "Commit: ${GITHUB_SHA}"
          echo "IPA: ${DOWNLOAD_URL}"
          echo
          echo "Cambios recientes:"
          echo "${CHANGELOG}"
          echo "MAIL_BODY_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Select latest Xcode
      run: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Apply iOS 16.3 patches
      run: |
        sed -i '' 's/deploymentTarget: "17.0"/deploymentTarget: "16.3"/g' project.yml
        python3 << 'PYEOF'
        import os
        import re
        from pathlib import Path

        ROOTS = [Path('Strand'), Path('StrandiOS'), Path('StrandiOSShared'), Path('StrandiOSWidgets')]
        COMPAT_PATH = Path('Strand/System/IOS16CIPatches.swift')
        SCROLL_HELPER = '.noopScrollBounceBehaviorBasedOnSizeHorizontal()'
        SCROLL_RE = re.compile(r'\.scrollBounceBehavior\(\s*\.basedOnSize\s*,\s*axes:\s*\.horizontal\s*\)')
        ONCHANGE_NEW_VALUE_RE = re.compile(
            r'\.onChange\(of:\s*([^)]+)\)\s*\{\s*_,\s*([A-Za-z_][A-Za-z0-9_]*)\s+in'
        )
        ONCHANGE_UNUSED_RE = re.compile(
            r'\.onChange\(of:\s*([^)]+)\)\s*\{\s*_,\s*_\s+in'
        )

        COMPAT_SOURCE = """#if os(iOS)
        import SwiftUI

        extension View {
            @ViewBuilder
            func noopScrollBounceBehaviorBasedOnSizeHorizontal() -> some View {
                if #available(iOS 16.4, *) {
                    self.scrollBounceBehavior(.basedOnSize, axes: .horizontal)
                } else {
                    self
                }
            }
        }
        #endif
        """

        def swift_files():
            for root in ROOTS:
                if not root.exists():
                    continue
                for path in root.rglob('*.swift'):
                    if path != COMPAT_PATH:
                        yield path

        def write_if_changed(path, content):
            old = path.read_text() if path.exists() else None
            if old != content:
                path.parent.mkdir(parents=True, exist_ok=True)
                path.write_text(content)
                return True
            return False

        def patch_swift_file(path):
            original = path.read_text()
            patched, scroll_count = SCROLL_RE.subn(SCROLL_HELPER, original)
            patched, onchange_new_value_count = ONCHANGE_NEW_VALUE_RE.subn(
                r'.onChange(of: \1) { \2 in', patched
            )
            patched, onchange_unused_count = ONCHANGE_UNUSED_RE.subn(
                r'.onChange(of: \1) { _ in', patched
            )

            if patched != original:
                path.write_text(patched)

            return scroll_count, onchange_new_value_count + onchange_unused_count

        def validate_no_unpatched_scroll_bounce():
            leftovers = []
            for path in swift_files():
                for line_no, line in enumerate(path.read_text().splitlines(), start=1):
                    if '.scrollBounceBehavior(' in line:
                        leftovers.append(f'{path}:{line_no}: {line.strip()}')
            if leftovers:
                print('Unpatched iOS 16.4 scrollBounceBehavior calls remain:')
                print('\n'.join(leftovers[:50]))
                raise SystemExit(1)

        total_scroll = 0
        total_onchange = 0
        touched = []

        for path in swift_files():
            scroll_count, onchange_count = patch_swift_file(path)
            if scroll_count or onchange_count:
                touched.append(f'{path} (scrollBounceBehavior={scroll_count}, onChange={onchange_count})')
                total_scroll += scroll_count
                total_onchange += onchange_count

        compat_changed = write_if_changed(COMPAT_PATH, COMPAT_SOURCE)
        validate_no_unpatched_scroll_bounce()

        print('iOS 16.3 compatibility patches applied')
        print(f'  scrollBounceBehavior replacements: {total_scroll}')
        print(f'  onChange compatibility rewrites: {total_onchange}')
        print(f'  compatibility helper: {COMPAT_PATH} {"written" if compat_changed else "already current"}')
        for entry in touched:
            print(f'  patched {entry}')
        PYEOF

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build archive
      run: |
        xcodebuild archive \
          -project Strand.xcodeproj \
          -scheme NOOPiOS \
          -destination 'generic/platform=iOS' \
          -archivePath ./NOOPiOS.xcarchive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R ./NOOPiOS.xcarchive/Products/Applications/NOOP\ Staging.app ./Payload/
        zip -r NOOP_iOS16_TrollStore.ipa Payload

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NOOP-iOS16-TrollStore
        path: NOOP_iOS16_TrollStore.ipa
        retention-days: 90

    - name: Update latest-ios16 release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-ios16
        name: "NOOP iOS 16.3 (auto-actualizada)"
        files: NOOP_iOS16_TrollStore.ipa
        prerelease: false
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send success email
      uses: dawidd6/action-send-mail@v18
      with:
        server_address: ${{ secrets.MAIL_SERVER }}
        server_port: ${{ secrets.MAIL_PORT }}
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: ${{ steps.release_meta.outputs.subject }}
        to: trejospeed@gmail.com
        from: ${{ secrets.MAIL_FROM }}
        body: ${{ steps.release_meta.outputs.body }}
